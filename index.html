<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross Exchange Course</title>

<script>
(function () {
  try {
    const savedTheme = localStorage.getItem('cross-exchange-theme');
    if (savedTheme === 'light') document.documentElement.classList.remove('dark');
    else document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        border:  'var(--border)',
        input:   'var(--input)',
        ring:    'var(--ring)',
        background: 'var(--background)',
        foreground: 'var(--foreground)',
        primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
        secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
        muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
        accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
        card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
        destructive: 'var(--destructive)'
      },
      borderRadius: {
        lg: 'var(--radius)',
        md: 'calc(var(--radius) - 2px)',
        sm: 'calc(var(--radius) - 4px)'
      },
      fontFamily: {
        sans: ['ui-sans-serif','system-ui','Segoe UI','Roboto','Inter','Arial','sans-serif']
      }
    }
  }
};
</script>

<style>
  /* ===== ShadcnUI Neutral theme ===== */
  :root {
    --background: #ffffff;
    --foreground: #0a0a0a;
    --card: #ffffff;
    --card-foreground: #0a0a0a;
    --popover: #ffffff;
    --popover-foreground: #0a0a0a;
    --primary: #171717;
    --primary-foreground: #fafafa;
    --secondary: #f5f5f5;
    --secondary-foreground: #171717;
    --muted: #f5f5f5;
    --muted-foreground: #737373;
    --accent: #f5f5f5;
    --accent-foreground: #171717;
    --destructive: #e7000b;
    --border: #e5e5e5;
    --input: #e5e5e5;
    --ring: #a1a1a1;
    --radius: 0.625rem;
  }

  .dark {
    --background: #0a0a0a;
    --foreground: #fafafa;
    --card: #171717;
    --card-foreground: #fafafa;
    --popover: #171717;
    --popover-foreground: #fafafa;
    --primary: #e5e5e5;
    --primary-foreground: #171717;
    --secondary: #262626;
    --secondary-foreground: #fafafa;
    --muted: #262626;
    --muted-foreground: #a1a1a1;
    --accent: #262626;
    --accent-foreground: #fafafa;
    --destructive: #ff6467;
    --border: rgba(255,255,255,0.1);
    --input: rgba(255,255,255,0.15);
    --ring: #737373;
  }

  html, body { height: 100%; }
  body { 
    background-color: var(--background); 
    color: var(--foreground); 
    overflow-x: auto;
  }

  /* Убираем спиннеры у числовых полей */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .invalid {
    border-color: var(--destructive) !important;
    background: color-mix(in srgb, var(--destructive) 8%, transparent) !important;
  }

  /* Фокус в стиле Shadcn */
  .shadcn-focus:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    border-color: var(--ring);
  }

  /* Убираем эффект выделения текста при частых тапах по кнопкам */
  .mobile-step-btn {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
</style>
</head>

<body class="min-h-screen font-sans antialiased text-[var(--foreground)]">

<main class="w-full max-w-[560px] min-w-[420px] mx-auto px-4 pt-12 pb-16">

  <!-- ===== HEADER ===== -->
  <header class="relative text-center mb-8 flex items-center justify-between px-1">
    <!-- Кнопка сброса -->
    <button id="resetBtn" type="button" title="Очистить сохранения"
      class="w-9 h-9 rounded-md
             bg-[var(--secondary)] text-[var(--secondary-foreground)]
             border border-[var(--border)]
             flex items-center justify-center
             hover:bg-[var(--accent)] hover:text-[var(--destructive)] transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>

    <h1 class="text-xl font-semibold tracking-tight absolute left-1/2 -translate-x-1/2">
      Cross Exchange Course
    </h1>

    <!-- Кнопка темы -->
    <button id="themeToggle" type="button" aria-label="Сменить тему"
      class="w-9 h-9 rounded-md
             bg-[var(--secondary)] text-[var(--secondary-foreground)]
             border border-[var(--border)]
             flex items-center justify-center
             hover:bg-[var(--accent)] transition-colors">
      <svg id="iconSun" style="display:none" class="w-4 h-4" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg id="iconMoon" style="display:none" class="w-4 h-4" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- ===== CURRENCY PANEL ===== -->
  <section class="rounded-lg border border-[var(--border)] bg-[var(--card)] p-3 mb-4">

    <div class="flex items-center justify-between gap-2">

      <!-- Currency 1 -->
      <div class="flex-1 min-w-0 rounded-md border border-[var(--border)] bg-[var(--background)] p-2 flex flex-col justify-between">
        <div class="text-[10px] font-medium text-[var(--muted-foreground)] uppercase tracking-wide truncate">
          Валюта 1
        </div>
        
        <div class="mt-1 flex items-center gap-1">
          <input id="rateA" tabindex="1" autofocus inputmode="decimal" spellcheck="false" autocomplete="off"
            class="shadcn-focus flex-1 w-full min-w-0 rounded-md
                   bg-[var(--secondary)] border border-[var(--input)]
                   px-2 py-1.5 text-sm font-semibold
                   text-right tabular-nums outline-none transition-colors
                   text-[var(--foreground)]">
          
          <!-- Мобильные стрелки для Валюты 1 -->
          <div class="flex flex-col md:hidden">
            <button type="button" data-target="rateA" data-dir="1" 
              class="mobile-step-btn w-5 h-4 flex items-center justify-center rounded text-[9px] text-[var(--muted-foreground)] hover:bg-[var(--accent)] active:bg-[var(--border)] transition-colors">▲</button>
            <button type="button" data-target="rateA" data-dir="-1" 
              class="mobile-step-btn w-5 h-4 flex items-center justify-center rounded text-[9px] text-[var(--muted-foreground)] hover:bg-[var(--accent)] active:bg-[var(--border)] transition-colors">▼</button>
          </div>
        </div>
        
        <div class="mt-2 pt-2 border-t border-[var(--border)]">
          <input id="codeA" tabindex="4" maxlength="8" spellcheck="false" autocomplete="off"
            class="w-full bg-transparent border-none outline-none
                   text-sm font-bold uppercase tracking-wide
                   placeholder:text-[var(--muted-foreground)]">
        </div>
      </div>

      <!-- Central Arrow & Swap -->
      <div class="flex flex-col items-center justify-center shrink-0 gap-1.5 px-1">
        <div class="text-[var(--muted-foreground)] text-base select-none">→</div>
        <button id="swapBtn" type="button" title="Поменять местами"
          class="w-7 h-6 rounded-md
                 bg-[var(--secondary)] hover:bg-[var(--accent)]
                 border border-[var(--border)]
                 flex items-center justify-center
                 text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-colors">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3L4 7l4 4"/>
            <path d="M4 7h16"/>
            <path d="M16 21l4-4-4-4"/>
            <path d="M20 17H4"/>
          </svg>
        </button>
      </div>

      <!-- Currency 2 -->
      <div class="flex-1 min-w-0 rounded-md border border-[var(--border)] bg-[var(--background)] p-2 flex flex-col justify-between">
        <div class="text-[10px] font-medium text-[var(--muted-foreground)] uppercase tracking-wide truncate">
          Валюта 2
        </div>
        
        <div class="mt-1 flex items-center gap-1">
          <input id="rateB" tabindex="2" inputmode="decimal" spellcheck="false" autocomplete="off"
            class="shadcn-focus flex-1 w-full min-w-0 rounded-md
                   bg-[var(--secondary)] border border-[var(--input)]
                   px-2 py-1.5 text-sm font-semibold
                   text-right tabular-nums outline-none transition-colors
                   text-[var(--foreground)]">
          
          <!-- Мобильные стрелки для Валюты 2 -->
          <div class="flex flex-col md:hidden">
            <button type="button" data-target="rateB" data-dir="1" 
              class="mobile-step-btn w-5 h-4 flex items-center justify-center rounded text-[9px] text-[var(--muted-foreground)] hover:bg-[var(--accent)] active:bg-[var(--border)] transition-colors">▲</button>
            <button type="button" data-target="rateB" data-dir="-1" 
              class="mobile-step-btn w-5 h-4 flex items-center justify-center rounded text-[9px] text-[var(--muted-foreground)] hover:bg-[var(--accent)] active:bg-[var(--border)] transition-colors">▼</button>
          </div>
        </div>
        
        <div class="mt-2 pt-2 border-t border-[var(--border)]">
          <input id="codeB" tabindex="5" maxlength="8" spellcheck="false" autocomplete="off"
            class="w-full bg-transparent border-none outline-none
                   text-sm font-bold uppercase tracking-wide
                   placeholder:text-[var(--muted-foreground)]">
        </div>
      </div>

    </div>
  </section>

  <!-- ===== RESULT PANEL ===== -->
  <section class="rounded-lg border border-[var(--border)] bg-[var(--card)] p-3">

    <div class="grid grid-cols-2 gap-3 items-end">

      <!-- Left: amount input -->
      <div class="min-w-0">
        <label class="block text-[11px] font-medium text-[var(--muted-foreground)] mb-1">
          Сумма
        </label>
        <div class="flex items-center rounded-md
                    bg-[var(--background)] border border-[var(--input)]
                    px-3 py-2
                    focus-within:ring-1 focus-within:ring-[var(--ring)]">
          <input id="amount" tabindex="3" value="1" inputmode="decimal" spellcheck="false" autocomplete="off"
            class="w-full min-w-0 bg-transparent border-none outline-none
                   text-lg font-semibold tabular-nums
                   text-[var(--foreground)]">
        </div>
      </div>

      <!-- Right: result -->
      <div class="min-w-0">
        <div class="block text-[11px] font-medium text-[var(--muted-foreground)] mb-1">
          Результат
        </div>
        <div class="flex items-center justify-end rounded-md 
                    bg-[var(--secondary)] border border-[var(--border)]
                    px-3 py-2">
          <div id="resultValue"
            class="w-full text-lg font-bold tabular-nums truncate
                   text-[var(--foreground)] text-right">—</div>
        </div>
      </div>

    </div>

    <!-- cross rate: всегда видим -->
    <div id="crossLine"
      class="mt-2 pt-2 border-t border-[var(--border)]
             text-xs text-[var(--muted-foreground)]
             text-center leading-relaxed min-h-[28px]">&nbsp;</div>

  </section>
</main>

<script>
(function () {
  'use strict';

  const LS_DATA  = 'cross-exchange-data';
  const LS_THEME = 'cross-exchange-theme';
  
  const $ = (id) => document.getElementById(id);

  const els = {
    codeA:  $('codeA'),
    rateA:  $('rateA'),
    codeB:  $('codeB'),
    rateB:  $('rateB'),
    amount: $('amount')
  };
  const KEYS = Object.keys(els);

  /* ===== ТЕМА ===== */
  function applyTheme() {
    const isDark = document.documentElement.classList.contains('dark');
    $('iconSun').style.display  = isDark ? '' : 'none';
    $('iconMoon').style.display = isDark ? 'none' : '';
  }

  $('themeToggle').addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem(LS_THEME, isDark ? 'dark' : 'light'); } catch (e) {}
    applyTheme();
  });

  applyTheme();

  /* ===== СОХРАНЕНИЕ И ЗАГРУЗКА ===== */
  function saveData() {
    const data = {};
    KEYS.forEach(k => data[k] = els[k].value);
    try { localStorage.setItem(LS_DATA, JSON.stringify(data)); } catch (e) {}
  }

  function loadData() {
    try {
      const saved = JSON.parse(localStorage.getItem(LS_DATA) || '{}');
      KEYS.forEach(k => {
        if (saved[k] != null) els[k].value = saved[k];
      });
    } catch (e) {}
  }

  loadData();

  /* ===== СБРОС ===== */
  $('resetBtn').addEventListener('click', () => {
    els.codeA.value = '';
    els.rateA.value = '';
    els.codeB.value = '';
    els.rateB.value = '';
    els.amount.value = '1';
    
    try { localStorage.removeItem(LS_DATA); } catch (e) {}
    
    render();
  });

  /* ===== ХЕЛПЕРЫ ===== */
  function parseNum(str) {
    if (typeof str !== 'string') return NaN;
    const v = parseFloat(str.replace(/\s/g, '').replace(',', '.'));
    return Number.isFinite(v) ? v : NaN;
  }

  function fmt(n, maxDec) {
    if (!Number.isFinite(n)) return '—';
    const abs = Math.abs(n);
    let dec = maxDec;
    if (dec == null) {
      if (abs === 0)        dec = 2;
      else if (abs >= 1000) dec = 2;
      else if (abs >= 1)    dec = 4;
      else if (abs >= 0.01) dec = 6;
      else                  dec = 8;
    }
    return new Intl.NumberFormat('ru-RU', {
      maximumFractionDigits: dec,
      minimumFractionDigits: 0
    }).format(n);
  }

  /* ===== УМНЫЕ СТРЕЛКИ ===== */
  function stepValue(input, direction) {
    let currentStr = input.value.replace(/\s/g, '').replace(',', '.');
    let current = parseFloat(currentStr);
    if (isNaN(current)) current = 0;

    const abs = Math.abs(current);
    let step = 1;

    // Определяем шаг
    if (abs < 10) {
      step = 0.01;
    } else if (abs < 100) {
      step = 0.1;
    } else if (abs < 1000) {
      step = 1;
    } else if (abs < 10000) {
      step = 10;
    } else {
      step = 100;
    }

    let nextValue = current + (step * direction);
    if (nextValue < 0) nextValue = 0;

    // Сохраняем дробную часть
    const parts = current.toString().split('.');
    const currentDecimals = parts.length > 1 ? parts[1].length : 0;
    
    let precision = currentDecimals;
    if (step < 1) {
      const stepPrecision = step.toString().split('.')[1].length;
      precision = Math.max(currentDecimals, stepPrecision);
    }

    // Округляем до нужной точности, чтобы убрать ошибки плавающей точки
    const rounded = parseFloat(nextValue.toFixed(precision));
    input.value = rounded.toString();

    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function handleArrowKeys(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    stepValue(e.target, e.key === 'ArrowUp' ? 1 : -1);
  }

  // Вешаем обработчики на поля курсов (для клавиатуры)
  els.rateA.addEventListener('keydown', handleArrowKeys);
  els.rateB.addEventListener('keydown', handleArrowKeys);

  // Вешаем обработчики на мобильные кнопки
  document.querySelectorAll('.mobile-step-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const targetId = btn.getAttribute('data-target');
      const dir = parseInt(btn.getAttribute('data-dir'), 10);
      stepValue(document.getElementById(targetId), dir);
    });
  });

  /* ===== РЕНДЕР ===== */
  function render() {
    const nameA = els.codeA.value.trim().toUpperCase();
    const nameB = els.codeB.value.trim().toUpperCase();

    const rA  = parseNum(els.rateA.value);
    const rB  = parseNum(els.rateB.value);
    const amt = parseNum(els.amount.value);

    const pos  = v => Number.isFinite(v) && v > 0;
    const okA  = pos(rA);
    const okB  = pos(rB);
    const okAm = Number.isFinite(amt) && amt >= 0;

    const emptyA = els.rateA.value.trim() === '';
    const emptyB = els.rateB.value.trim() === '';
    const emptyAm = els.amount.value.trim() === '';

    els.rateA.classList.toggle('invalid', !emptyA && !okA);
    els.rateB.classList.toggle('invalid', !emptyB && !okB);
    els.amount.classList.toggle('invalid', !emptyAm && !okAm);

    if (!(okA && okB && okAm)) {
      $('resultValue').textContent = '—';
      $('crossLine').innerHTML = '&nbsp;';
      return;
    }

    const inCore = amt / rA;
    const out    = inCore * rB;
    const cross  = rB / rA;

    $('resultValue').textContent = fmt(out);
    
    let cur1 = '', cur2 = '', val = 0;
    if (cross >= 1) {
      val = cross;
      cur1 = nameA;
      cur2 = nameB;
    } else {
      val = 1 / cross;
      cur1 = nameB;
      cur2 = nameA;
    }

    const leftStr = '1' + (cur1 ? ' ' + cur1 : '');
    const rightStr = '<b class="font-semibold tabular-nums text-[var(--foreground)]">' + fmt(val) + '</b>' + (cur2 ? ' ' + cur2 : '');

    $('crossLine').innerHTML = 'Кросс-курс: ' + leftStr + ' = ' + rightStr;
  }

  /* ===== СОБЫТИЯ ===== */
  KEYS.forEach(k => {
    els[k].addEventListener('input', () => { 
      render(); 
      saveData();
    });
  });

  $('swapBtn').addEventListener('click', () => {
    const cA = els.codeA.value, rA = els.rateA.value;
    els.codeA.value = els.codeB.value;
    els.rateA.value = els.rateB.value;
    els.codeB.value = cA;
    els.rateB.value = rA;
    render();
    saveData();
  });

  render();
})();
</script>
</body>
</html>
