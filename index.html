<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Cross Exchange Course</title>

<script>
(function () {
  try {
    const savedTheme = localStorage.getItem('cross-exchange-theme');
    if (savedTheme === 'light') document.documentElement.classList.remove('dark');
    else document.documentElement.classList.add('dark');
  } catch (e) {}
})();
</script>

<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        border:  'var(--border)',
        input:   'var(--input)',
        ring:    'var(--ring)',
        background: 'var(--background)',
        foreground: 'var(--foreground)',
        primary: { DEFAULT: 'var(--primary)', foreground: 'var(--primary-foreground)' },
        secondary: { DEFAULT: 'var(--secondary)', foreground: 'var(--secondary-foreground)' },
        muted: { DEFAULT: 'var(--muted)', foreground: 'var(--muted-foreground)' },
        accent: { DEFAULT: 'var(--accent)', foreground: 'var(--accent-foreground)' },
        card: { DEFAULT: 'var(--card)', foreground: 'var(--card-foreground)' },
        destructive: 'var(--destructive)'
      },
      borderRadius: {
        lg: 'var(--radius)',
        md: 'calc(var(--radius) - 2px)',
        sm: 'calc(var(--radius) - 4px)'
      },
      fontFamily: {
        sans: ['ui-sans-serif','system-ui','Segoe UI','Roboto','Inter','Arial','sans-serif']
      }
    }
  }
};
</script>

<style>
  /* ===== ShadcnUI Neutral theme ===== */
  :root {
    --background: #ffffff;
    --foreground: #0a0a0a;
    --card: #ffffff;
    --card-foreground: #0a0a0a;
    --popover: #ffffff;
    --popover-foreground: #0a0a0a;
    --primary: #171717;
    --primary-foreground: #fafafa;
    --secondary: #f5f5f5;
    --secondary-foreground: #171717;
    --muted: #f5f5f5;
    --muted-foreground: #737373;
    --accent: #f5f5f5;
    --accent-foreground: #171717;
    --destructive: #e7000b;
    --border: #e5e5e5;
    --input: #e5e5e5;
    --ring: #a1a1a1;
    --radius: 0.625rem;
  }

  .dark {
    --background: #0a0a0a;
    --foreground: #fafafa;
    --card: #171717;
    --card-foreground: #fafafa;
    --popover: #171717;
    --popover-foreground: #fafafa;
    --primary: #e5e5e5;
    --primary-foreground: #171717;
    --secondary: #262626;
    --secondary-foreground: #fafafa;
    --muted: #262626;
    --muted-foreground: #a1a1a1;
    --accent: #262626;
    --accent-foreground: #fafafa;
    --destructive: #ff6467;
    --border: rgba(255,255,255,0.1);
    --input: rgba(255,255,255,0.15);
    --ring: #737373;
  }

  html, body { 
    height: 100%; 
    margin: 0;
    padding: 0;
  }
  
  body { 
    background-color: var(--background); 
    color: var(--foreground); 
    min-height: 100dvh; 
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Убираем спиннеры у числовых полей */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  .invalid {
    border-color: var(--destructive) !important;
    background: color-mix(in srgb, var(--destructive) 8%, transparent) !important;
  }

  /* Фокус в стиле Shadcn */
  .shadcn-focus:focus {
    outline: none;
    box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring);
    border-color: var(--ring);
  }

  /* Убираем эффект выделения текста при частых тапах по кнопкам */
  .step-btn {
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
</style>
</head>

<body class="font-sans antialiased text-[var(--foreground)] flex flex-col items-center">

<main class="w-full max-w-[560px] px-4 pt-6 pb-12 md:pt-10 md:pb-16">

  <!-- ===== HEADER (Только кнопки) ===== -->
  <header class="relative flex items-center justify-end px-1 mb-4">
    <div class="flex items-center gap-2">
      <!-- Кнопка сброса (стандартная иконка Eraser из Lucide) -->
      <button id="resetBtn" type="button" title="Очистить сохранения"
        class="w-9 h-9 rounded-md
               bg-[var(--secondary)] text-[var(--secondary-foreground)]
               border border-[var(--border)]
               flex items-center justify-center
               hover:bg-[var(--accent)] hover:text-[var(--destructive)] transition-colors">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/>
          <path d="M22 21H7"/>
          <path d="m5 11 9 9"/>
        </svg>
      </button>

      <!-- Кнопка темы -->
      <button id="themeToggle" type="button" aria-label="Сменить тему"
        class="w-9 h-9 rounded-md
               bg-[var(--secondary)] text-[var(--secondary-foreground)]
               border border-[var(--border)]
               flex items-center justify-center
               hover:bg-[var(--accent)] transition-colors">
        <svg id="iconSun" style="display:none" class="w-4 h-4" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg id="iconMoon" style="display:none" class="w-4 h-4" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===== CURRENCY PANEL ===== -->
  <section class="rounded-lg border border-[var(--border)] bg-[var(--card)] p-4 mb-4">
    
    <div class="grid grid-cols-[1fr_auto_1fr] gap-x-3 gap-y-2 items-center">

      <!-- 1 ряд: Лейблы (выровнены по левому краю) -->
      <div class="text-[10px] font-medium text-[var(--muted-foreground)] uppercase tracking-wide truncate pl-1">
        Валюта 1
      </div>
      <div class="w-10"></div>
      <div class="text-[10px] font-medium text-[var(--muted-foreground)] uppercase tracking-wide truncate pl-1">
        Валюта 2
      </div>

      <!-- 2 ряд: Инпуты и кнопка Swap -->
      <div class="flex items-center gap-1.5 h-10">
        <input id="rateA" tabindex="1" autofocus inputmode="decimal" spellcheck="false" autocomplete="off"
          class="shadcn-focus flex-1 w-full min-w-0 rounded-md h-10
                 bg-[var(--background)] border border-[var(--input)]
                 px-2 text-lg font-semibold
                 text-right tabular-nums outline-none transition-colors
                 text-[var(--foreground)]">
        
        <div class="flex flex-col gap-[2px] justify-between h-10 shrink-0">
          <button type="button" tabindex="-1" data-target="rateA" data-dir="1" 
            class="step-btn w-6 h-[19px] flex items-center justify-center rounded
                   bg-[var(--background)] border border-[var(--input)]
                   text-[10px] font-bold text-[var(--muted-foreground)] 
                   hover:bg-[var(--accent)] hover:text-[var(--foreground)] 
                   active:scale-95 transition-all">▲</button>
          <button type="button" tabindex="-1" data-target="rateA" data-dir="-1" 
            class="step-btn w-6 h-[19px] flex items-center justify-center rounded
                   bg-[var(--background)] border border-[var(--input)]
                   text-[10px] font-bold text-[var(--muted-foreground)] 
                   hover:bg-[var(--accent)] hover:text-[var(--foreground)] 
                   active:scale-95 transition-all">▼</button>
        </div>
      </div>

      <!-- Кнопка Swap по центру -->
      <button id="swapBtn" type="button" title="Поменять местами"
        class="w-10 h-10 rounded-md bg-[var(--secondary)] hover:bg-[var(--accent)] border border-[var(--border)] flex items-center justify-center text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition-colors mx-0.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3L4 7l4 4"/>
          <path d="M4 7h16"/>
          <path d="M16 21l4-4-4-4"/>
          <path d="M20 17H4"/>
        </svg>
      </button>

      <div class="flex items-center gap-1.5 h-10">
        <input id="rateB" tabindex="2" inputmode="decimal" spellcheck="false" autocomplete="off"
          class="shadcn-focus flex-1 w-full min-w-0 rounded-md h-10
                 bg-[var(--background)] border border-[var(--input)]
                 px-2 text-lg font-semibold
                 text-right tabular-nums outline-none transition-colors
                 text-[var(--foreground)]">
        
        <div class="flex flex-col gap-[2px] justify-between h-10 shrink-0">
          <button type="button" tabindex="-1" data-target="rateB" data-dir="1" 
            class="step-btn w-6 h-[19px] flex items-center justify-center rounded
                   bg-[var(--background)] border border-[var(--input)]
                   text-[10px] font-bold text-[var(--muted-foreground)] 
                   hover:bg-[var(--accent)] hover:text-[var(--foreground)] 
                   active:scale-95 transition-all">▲</button>
          <button type="button" tabindex="-1" data-target="rateB" data-dir="-1" 
            class="step-btn w-6 h-[19px] flex items-center justify-center rounded
                   bg-[var(--background)] border border-[var(--input)]
                   text-[10px] font-bold text-[var(--muted-foreground)] 
                   hover:bg-[var(--accent)] hover:text-[var(--foreground)] 
                   active:scale-95 transition-all">▼</button>
        </div>
      </div>

    </div>
  </section>

  <!-- ===== RESULT PANEL ===== -->
  <section class="rounded-lg border border-[var(--border)] bg-[var(--card)] p-4">

    <div class="grid grid-cols-2 gap-3 items-end">

      <!-- Left: amount input -->
      <div class="min-w-0">
        <label class="block text-[10px] font-medium text-[var(--muted-foreground)] uppercase tracking-wide mb-1.5 pl-1">
          Сумма
        </label>
        <input id="amount" tabindex="3" value="1" inputmode="decimal" spellcheck="false" autocomplete="off"
          class="shadcn-focus w-full h-10 rounded-md 
                 bg-[var(--background)] border border-[var(--input)] px-3 outline-none
                 text-lg font-semibold tabular-nums
                 text-[var(--foreground)]">
      </div>

      <!-- Right: result -->
      <div class="min-w-0">
        <div class="block text-[10px] font-medium text-[var(--muted-foreground)] uppercase tracking-wide mb-1.5 pl-1">
          Результат
        </div>
        <div class="flex items-center justify-end w-full h-10 rounded-md 
                    bg-[var(--secondary)] border border-[var(--border)] px-3">
          <div id="resultValue"
            class="w-full text-lg font-bold tabular-nums truncate
                   text-[var(--foreground)] text-right"></div>
        </div>
      </div>

    </div>

    <!-- cross rate -->
    <div id="crossLine"
      class="mt-3 pt-3 border-t border-[var(--border)]
             text-xs text-[var(--muted-foreground)]
             text-center leading-relaxed min-h-[28px]">Кросс-курс</div>

  </section>
</main>

<script>
(function () {
  'use strict';

  const LS_DATA  = 'cross-exchange-data-v2';
  const LS_THEME = 'cross-exchange-theme';
  
  const $ = (id) => document.getElementById(id);

  const els = {
    rateA:  $('rateA'),
    rateB:  $('rateB'),
    amount: $('amount')
  };
  const KEYS = Object.keys(els);

  /* ===== ТЕМА ===== */
  function applyTheme() {
    const isDark = document.documentElement.classList.contains('dark');
    $('iconSun').style.display  = isDark ? '' : 'none';
    $('iconMoon').style.display = isDark ? 'none' : '';
  }

  $('themeToggle').addEventListener('click', () => {
    const isDark = document.documentElement.classList.toggle('dark');
    try { localStorage.setItem(LS_THEME, isDark ? 'dark' : 'light'); } catch (e) {}
    applyTheme();
  });

  applyTheme();

  /* ===== СОХРАНЕНИЕ И ЗАГРУЗКА ===== */
  function saveData() {
    const data = {};
    KEYS.forEach(k => data[k] = els[k].value);
    try { localStorage.setItem(LS_DATA, JSON.stringify(data)); } catch (e) {}
  }

  function loadData() {
    try {
      const saved = JSON.parse(localStorage.getItem(LS_DATA) || '{}');
      KEYS.forEach(k => {
        if (saved[k] != null) els[k].value = saved[k];
      });
    } catch (e) {}
  }

  loadData();

  /* ===== СБРОС ===== */
  $('resetBtn').addEventListener('click', () => {
    els.rateA.value = '';
    els.rateB.value = '';
    els.amount.value = '1';
    
    try { localStorage.removeItem(LS_DATA); } catch (e) {}
    
    render();
  });

  /* ===== ХЕЛПЕРЫ ===== */
  function parseNum(str) {
    if (typeof str !== 'string') return NaN;
    const v = parseFloat(str.replace(/\s/g, '').replace(',', '.'));
    return Number.isFinite(v) ? v : NaN;
  }

  function fmt(n, maxDec) {
    if (!Number.isFinite(n)) return '';
    const abs = Math.abs(n);
    let dec = maxDec;
    if (dec == null) {
      if (abs === 0)        dec = 2;
      else if (abs >= 1000) dec = 2;
      else if (abs >= 1)    dec = 4;
      else if (abs >= 0.01) dec = 6;
      else                  dec = 8;
    }
    return new Intl.NumberFormat('ru-RU', {
      maximumFractionDigits: dec,
      minimumFractionDigits: 0
    }).format(n);
  }

  /* ===== УМНЫЕ СТРЕЛКИ ===== */
  function stepValue(input, direction) {
    let currentStr = input.value.replace(/\s/g, '').replace(',', '.');
    let current = parseFloat(currentStr);
    if (isNaN(current)) current = 0;

    const abs = Math.abs(current);
    let step = 1;

    if (abs < 10) {
      step = 0.01;
    } else if (abs < 100) {
      step = 0.1;
    } else if (abs < 1000) {
      step = 1;
    } else if (abs < 10000) {
      step = 10;
    } else {
      step = 100;
    }

    let nextValue = current + (step * direction);
    if (nextValue < 0) nextValue = 0;

    const parts = current.toString().split('.');
    const currentDecimals = parts.length > 1 ? parts[1].length : 0;
    
    let precision = currentDecimals;
    if (step < 1) {
      const stepPrecision = step.toString().split('.')[1].length;
      precision = Math.max(currentDecimals, stepPrecision);
    }

    const rounded = parseFloat(nextValue.toFixed(precision));
    input.value = rounded.toString();

    input.dispatchEvent(new Event('input', { bubbles: true }));
  }

  function handleArrowKeys(e) {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault();
    stepValue(e.target, e.key === 'ArrowUp' ? 1 : -1);
  }

  els.rateA.addEventListener('keydown', handleArrowKeys);
  els.rateB.addEventListener('keydown', handleArrowKeys);

  document.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.preventDefault();
      const targetId = btn.getAttribute('data-target');
      const dir = parseInt(btn.getAttribute('data-dir'), 10);
      stepValue(document.getElementById(targetId), dir);
    });
  });

  /* ===== РЕНДЕР ===== */
  function render() {
    const rA  = parseNum(els.rateA.value);
    const rB  = parseNum(els.rateB.value);
    const amt = parseNum(els.amount.value);

    const pos  = v => Number.isFinite(v) && v > 0;
    const okA  = pos(rA);
    const okB  = pos(rB);
    const okAm = Number.isFinite(amt) && amt >= 0;

    const emptyA = els.rateA.value.trim() === '';
    const emptyB = els.rateB.value.trim() === '';
    const emptyAm = els.amount.value.trim() === '';

    els.rateA.classList.toggle('invalid', !emptyA && !okA);
    els.rateB.classList.toggle('invalid', !emptyB && !okB);
    els.amount.classList.toggle('invalid', !emptyAm && !okAm);

    if (!(okA && okB && okAm)) {
      $('resultValue').textContent = '';
      $('crossLine').innerHTML = 'Кросс-курс';
      return;
    }

    const inCore = amt / rA;
    const out    = inCore * rB;
    const cross  = rB / rA;

    $('resultValue').textContent = fmt(out);
    
    let val = 0;
    if (cross >= 1) {
      val = cross;
    } else {
      val = 1 / cross;
    }

    $('crossLine').innerHTML = 'Кросс-курс: 1 = <b class="font-semibold tabular-nums text-[var(--foreground)]">' + fmt(val) + '</b>';
  }

  /* ===== СОБЫТИЯ ===== */
  KEYS.forEach(k => {
    els[k].addEventListener('input', () => { 
      render(); 
      saveData();
    });
  });

  $('swapBtn').addEventListener('click', () => {
    const rA = els.rateA.value;
    els.rateA.value = els.rateB.value;
    els.rateB.value = rA;
    render();
    saveData();
  });

  render();
})();
</script>
</body>
</html>
